services:
  backend:
    build: ./backend
    container_name: logtastiq-backend
    environment:
      DATABASE_URL: sqlite:////data/hellotherelogs.sqlite3
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-900}
      WCL_CLIENT_ID: ${WCL_CLIENT_ID:-}
      WCL_CLIENT_SECRET: ${WCL_CLIENT_SECRET:-}
      WCL_TOKEN_URL: ${WCL_TOKEN_URL:-https://www.warcraftlogs.com/oauth/token}
      WCL_GRAPHQL_URL: ${WCL_GRAPHQL_URL:-https://fresh.warcraftlogs.com/api/v2/client}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      BRAND_PORTAL_NAME: ${BRAND_PORTAL_NAME:-Logtastiq}
      BRAND_TAGLINE: ${BRAND_TAGLINE:-Turn Warcraft Logs into clear next steps.}
      BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
      BRAND_PRIMARY_COLOR: ${BRAND_PRIMARY_COLOR:-#f2c14e}
      BRAND_ACCENT_COLOR: ${BRAND_ACCENT_COLOR:-#e7a7c3}
    volumes:
      - hellotherelogs_data:/data
    expose:
      - "8000"
    restart: unless-stopped
  frontend:
    build: ./frontend
    container_name: logtastiq-frontend
    ports:
      - "${LOGTASTIQ_BIND_ADDRESS:-${HELLOTHERELOGS_BIND_ADDRESS:-0.0.0.0}}:${LOGTASTIQ_PORT:-${HELLOTHERELOGS_PORT:-8080}}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hellotherelogs_data:
